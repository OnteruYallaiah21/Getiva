[pytest]
# Pytest configuration for GETIVA

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    auth: Authentication tests
    applications: Application endpoint tests
    payments: Payment endpoint tests
    analytics: Analytics endpoint tests
    integration: Integration tests
    slow: Slow running tests
    unit: Unit tests

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
