<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — GETIVA</title>
    <link rel="icon" href="images/getiva.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/getiva-theme.css">
    <link rel="stylesheet" href="css/auth-pages.css">
</head>
<body class="auth-body">
    <div class="auth-orb auth-orb--1" aria-hidden="true"></div>
    <div class="auth-orb auth-orb--2" aria-hidden="true"></div>
    <div class="auth-shell">
        <div class="auth-layout">
            <div class="auth-card">
                <a class="auth-back" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
                <div class="auth-brand">
                    <img src="images/getiva.png" alt="GETIVA" width="40" height="40" style="object-fit: contain;">
                    <span>GETIVA</span>
                </div>
                <h1>Sign in</h1>
                <p class="sub">Use the username and password your administrator gave you.</p>
                <div class="auth-hint" role="note">
                    <span class="auth-hint-icon" aria-hidden="true">🔐</span>
                    <span>Accounts are created by an admin—there is no public registration.</span>
                </div>
                <form id="loginFormElement">
                    <div class="auth-field">
                        <label for="loginUsername">Username</label>
                        <div class="auth-input-wrap">
                            <input class="auth-input" type="text" id="loginUsername" name="username" required autocomplete="username" placeholder="Enter your username">
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="loginPassword">Password</label>
                        <div class="auth-input-wrap">
                            <input class="auth-input" type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Enter your password">
                            <button type="button" class="auth-toggle-pw" data-auth-toggle="loginPassword" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="form-error" id="loginError"></div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Sign in</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/auth-pages.js"></script>
</body>
</html>
