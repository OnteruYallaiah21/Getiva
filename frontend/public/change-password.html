<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password — GETIVA</title>
    <link rel="icon" href="images/getiva.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/getiva-theme.css">
    <link rel="stylesheet" href="css/auth-pages.css">
</head>
<body class="auth-body">
    <div class="auth-orb auth-orb--1" aria-hidden="true"></div>
    <div class="auth-orb auth-orb--2" aria-hidden="true"></div>
    <div class="auth-shell">
        <div class="auth-layout">
            <div class="auth-card">
                <div class="auth-brand">
                    <img src="images/getiva.png" alt="GETIVA" width="40" height="40" style="object-fit: contain;">
                    <span>GETIVA</span>
                </div>
                <h1>Set a new password</h1>
                <p class="sub">If you had a temporary password, replace it with a strong one you do not use on other sites.</p>
                <div class="auth-hint" role="note">
                    <span class="auth-hint-icon" aria-hidden="true">✓</span>
                    <span>Use at least 8 characters. Mix letters, numbers, and symbols.</span>
                </div>
                <form id="changePasswordFormElement">
                    <div class="auth-field">
                        <label for="currentPassword">Current password</label>
                        <div class="auth-input-wrap">
                            <input class="auth-input" type="password" id="currentPassword" required autocomplete="current-password" placeholder="Current password">
                            <button type="button" class="auth-toggle-pw" data-auth-toggle="currentPassword" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="newPassword">New password</label>
                        <div class="auth-input-wrap">
                            <input class="auth-input" type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
                            <button type="button" class="auth-toggle-pw" data-auth-toggle="newPassword" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="confirmPassword">Confirm new password</label>
                        <div class="auth-input-wrap">
                            <input class="auth-input" type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Repeat new password">
                            <button type="button" class="auth-toggle-pw" data-auth-toggle="confirmPassword" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="form-error" id="changePasswordError"></div>
                    <button type="submit" class="btn btn-primary btn-block" id="changePasswordSubmit">Update password</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/auth-pages.js"></script>
</body>
</html>
