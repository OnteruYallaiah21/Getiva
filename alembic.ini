# Alembic Configuration File

# Path to migration scripts
script_location = alembic

# Database URL (will be overridden by env.py from config)
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Migration file format
file_template = %%(rev)s_%%(slug)s

# Version location style
version_location_template = %%(branch_label)s/%%(rev)s_%%(slug)s

# Version path style (can be 'dropbox', 'fsid', or 'default')
version_path_style = default

# SQLAlchemy echo setting
sqlalchemy.echo = false

# Transaction isolation level
sqlalchemy.isolation_level =

# Migrations are compared and rendered to a script file
render_as_batch = true
