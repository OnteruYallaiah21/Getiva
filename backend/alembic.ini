# Alembic configuration — keys must live under [alembic] (ConfigParser requires sections).

[alembic]
script_location = migrations
prepend_sys_path = .

# Database URL (overridden by migrations/env.py from app settings)
sqlalchemy.url =

file_template = %%(rev)s_%%(slug)s
version_location_template = %%(branch_label)s/%%(rev)s_%%(slug)s
version_path_style = default
version_path_separator = os

sqlalchemy.echo = false

render_as_batch = true

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
